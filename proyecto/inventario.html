<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" href="/proyecto/css/inventario.css">
</head>

<body>
    <header>
        <h1>Sistema de Gestión de Inventario</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="inventario.html">Inventario</a>
            <a href="prestamos.html">Préstamos</a>
            <a href="reportes.html">Reportes</a>
            <a href="login.html" class="login">Iniciar Sesión</a>
        </nav>
    </header>
    <div class="banner">
        <section class="titulo">
            <h2>Gestión de Inventario</h2>
            <p>Registro y control de equipos e insumos.</p>
        </section>
        <section class="contenedor">
            <div class="formulario">
                <h3>Registrar Recurso</h3>
                <input type="text" placeholder="Nombre del recurso">
                <input type="number" placeholder="Cantidad">
                <select>
                    <option>Equipo Médico</option>
                    <option>Equipo de Rescate</option>
                    <option>Insumo</option>
                </select>

                <button>Guardar</button>
            </div>
            <div class="tabla">
                <h3>Lista de Recursos</h3>
                <table>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Cantidad</th>
                        <th>Categoría</th>
                    </tr>
                </table>
            </div>
        </section>
        
    </div>
    <footer>
        <p>Universidad Fidélitas - Proyecto Cliente Servidor</p>
    </footer>

</body>

</html>
