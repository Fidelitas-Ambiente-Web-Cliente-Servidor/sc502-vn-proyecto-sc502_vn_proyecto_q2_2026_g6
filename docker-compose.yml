services:
  web:
    image: php:8.2-apache
    container_name: php-apache-demo2

    ports:
      - "8080:80"

    volumes:
      - ./proyecto:/var/www/html

    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-demo2
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass

    volumes:
      - db_data:/var/lib/mysql

    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-demo2

    depends_on:
      - db

    environment:
      PMA_HOST: db
      PMA_USER: appuser
      PMA_PASSWORD: apppass

    ports:
      - "8082:80"

volumes:
  db_data: